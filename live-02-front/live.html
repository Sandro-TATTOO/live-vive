<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>LiveKit - Stream & Viewer</title>

  <!-- LiveKit SDK -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 20px;
    }

    h2 {
      margin-bottom: 10px;
    }

    button {
      margin: 5px;
      padding: 10px 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-weight: bold;
    }

    #startCamera {
      background: #00c853;
      color: white;
    }

    #watchLive {
      background: #2962ff;
      color: white;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
      padding: 5px;
      display: inline-block;
    }

    .live {
      color: #00e676;
    }

    .offline {
      color: #ff5252;
    }

    video {
      width: 420px;
      margin-top: 10px;
      border: 2px solid #444;
      border-radius: 10px;
      background: black;
    }

    #console {
      margin-top: 15px;
      background: black;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }
  </style>
</head>

<body>

  <h2>🎥 LiveKit System</h2>

  <!-- STREAMER -->
  <button id="startCamera">🔴 INICIAR LIVE (STREAMER)</button>

  <!-- VIEWER -->
  <button id="watchLive">🔵 ASSISTIR LIVE (VIEWER)</button>

  <!-- STATUS -->
  <div id="status" class="offline">OFFLINE</div>

  <!-- VIDEO LOCAL -->
  <div>
    <video id="video" autoplay playsinline></video>
  </div>

  <!-- CONSOLE -->
  <pre id="console"></pre>

  <!-- APP JS -->
  <script src="app.js"></script>

</body>

</html>
